# dsh-testsuite 控制面配置示例
#
# 复制为 config.yaml（已 gitignore）后：
#   make image DSH_VERSION=0.1.1-rc.1
#   go run ./cmd/dsh-testsuite -config config.yaml
# 在 UI「镜像版本」里登记该 tag。
# docker.imageRepository 可写成 ghcr.io/cocofhu/dsh-testsuite-runtime

server:
  listen: ":8090"
  # 「打开」链接和 dsh --trusted-host 用的主机名。远程访问填这台机器的 IP/域名。
  publicHost: ""
  webDir: web

# docker（默认）或 kubernetes。kubernetes 时必须自备通配 DNS 并填写 envHostTemplate。
runtime: docker

docker:
  # 0.0.0.0 才能从局域网/公网打开环境端口；只本机用可改成 127.0.0.1。
  bindIP: "0.0.0.0"
  network: ""
  # 登记镜像时若只填版本、不填完整 ref，默认拼成 <imageRepository>:<version>
  # CI 产物：ghcr.io/cocofhu/dsh-testsuite-runtime
  imageRepository: dsh-testsuite-runtime
  cpuCores: 0
  memoryMB: 0

# runtime: kubernetes 时取消注释并改成你自己的通配域名（必须含 {id}）。
# kubernetes:
#   namespace: ""
#   kubeconfig: ""
#   envHostTemplate: "env-{id}.example.com"
#   ingressClass: nginx
#   imagePullPolicy: IfNotPresent
#   # 填写后每个环境一块 PVC（RWO）；销毁环境时删除 PVC，卷按 StorageClass 默认 Delete 回收。
#   storageClass: ""
#   storageSize: 10Gi
#   # 可选。只影响调度预留；上限仍用上面的 docker.cpuCores / docker.memoryMB。
#   cpuRequest: "250m"
#   memoryRequest: "512Mi"

limits:
  maxEnvs: 8
  idleTTL: 2h
